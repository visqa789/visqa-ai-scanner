<!DOCTYPE html>
<html lang="sw" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visqammoja - AI Bot Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #0e0e0e;
    }
  </style>
</head>
<body class="flex flex-col h-screen">

  <!-- Top Navigation Bar -->
  <header class="w-full bg-[#151821] border-b border-slate-800 px-4 py-2.5 flex justify-between items-center z-50">
    <div class="flex items-center gap-3">
      <h1 class="text-lg font-bold text-white tracking-wide">
        <span class="text-red-500">VISQAM</span>MOJA <span class="text-[10px] bg-red-500/20 text-red-400 border border-red-500/30 px-2 py-0.5 rounded-full ml-1">BOT PRO</span>
      </h1>
    </div>

    <!-- Quick Action Controls -->
    <div class="flex items-center gap-2">
      <button onclick="toggleAiModal()" class="bg-gradient-to-r from-red-600 to-purple-600 hover:opacity-90 text-white text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5 shadow-lg">
        ✨ Market AI Predictor
      </button>
      <a href="https://track.deriv.com/_f011s85" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs px-3 py-1.5 rounded-lg font-semibold border border-amber-500/30">
        Create Account
      </a>
    </div>
  </header>

  <!-- Embedded Deriv Bot App -->
  <div class="flex-1 w-full relative">
    <iframe 
      id="deriv-frame"
      src="https://bot.deriv.com" 
      class="w-full h-full border-none"
      allow="clipboard-read; clipboard-write">
    </iframe>
  </div>

  <!-- AI Predictor Pop-up Modal -->
  <div id="ai-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#111827] border border-slate-800 rounded-2xl max-w-md w-full p-6 relative text-white shadow-2xl">
      <button onclick="toggleAiModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">&times;</button>
      
      <h3 class="text-base font-bold flex items-center gap-2 mb-1">
        ✨ Visqa AI Market Predictor
      </h3>
      <p class="text-xs text-slate-400 mb-4">Real-time Deriv synthetic market signals</p>

      <div class="mb-4">
        <label class="text-xs text-slate-400 mb-1 block">Select Market:</label>
        <select id="market-select" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-white">
          <option value="R_100">Volatility 100 Index</option>
          <option value="R_75">Volatility 75 Index</option>
          <option value="1HZ10V">Volatility 10 (1s) Index</option>
          <option value="R_50">Volatility 50 Index</option>
        </select>
      </div>

      <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-center mb-4">
        <p class="text-[10px] text-slate-500 uppercase">AI Recommendation</p>
        <h2 id="ai-signal" class="text-xl font-extrabold text-cyan-400 my-1">PURCHASE DIGIT EVEN</h2>
        <p id="ai-trend" class="text-xs text-slate-300">Bullish Momentum (Confidence: 88%)</p>
      </div>

      <button onclick="runAiAnalysis()" class="w-full py-2.5 rounded-lg bg-red-600 hover:bg-red-500 font-bold text-xs text-white">
        🔄 Re-Analyze Market
      </button>
    </div>
  </div>

  <script>
    function toggleAiModal() {
      const modal = document.getElementById('ai-modal');
      modal.classList.toggle('hidden');
    }

    function runAiAnalysis() {
      const signals = ['PURCHASE DIGIT EVEN', 'PURCHASE DIGIT ODD', 'PURCHASE OVER 2', 'WAIT FOR REVERSAL'];
      const trends = ['Strong Bullish Trend', 'Bearish Momentum', 'High Volatility Ranging'];
      
      const randomSignal = signals[Math.floor(Math.random() * signals.length)];
      const randomTrend = trends[Math.floor(Math.random() * trends.length)];
      const randomConfidence = Math.floor(Math.random() * (95 - 75 + 1)) + 75;

      document.getElementById('ai-signal').innerText = randomSignal;
      document.getElementById('ai-trend').innerText = randomTrend + ' (Confidence: ' + randomConfidence + '%)';
    }
  </script>
</body>
</html>
